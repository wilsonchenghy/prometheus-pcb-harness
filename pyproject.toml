[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-pcb"
version = "0.1.0"
description = "Prometheus, the AI PCB harness: design PCBs in Python: parts on real KiCad footprints, nets, routed copper, IPC-2221 checks, Gerbers, KiCad export, schematics and 3D boards"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy", "shapely>=2", "pillow", "matplotlib"]

[project.optional-dependencies]
3d = ["build123d"]
schematic = ["schemdraw", "cairosvg", "pypdf"]
dev = ["pytest", "build123d", "schemdraw", "cairosvg", "pypdf", "gerbonara", "kiutils"]

[project.scripts]
prometheus = "pcb_cli:main"
zeus = "pcb_cli:main"            # (the name before Prometheus: still works)
pcb-harness = "pcb_cli:main"   # (the old name, kept working)

[tool.setuptools]
py-modules = ["pcb", "schem", "vendor_parts", "fab", "pcb_cli", "freerouting", "critic", "pcb_view", "parts", "kicad_sch", "fpgen", "kicad_import"]
packages = ["pcb_footprints", "pcb_viewer_assets"]

[tool.setuptools.package-data]
pcb_footprints = ["*.pretty/*.kicad_mod"]
pcb_viewer_assets = ["*.html", "*.js", "*.txt", "*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
