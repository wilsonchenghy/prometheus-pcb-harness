[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-harness"
version = "0.1.0"
description = "Design PCBs in Python: parts on real KiCad footprints, nets, routed copper, IPC-2221 checks, Gerbers, KiCad export, schematics and 3D boards"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy", "shapely>=2", "pillow"]

[project.optional-dependencies]
3d = ["build123d"]
schematic = ["schemdraw", "cairosvg", "pypdf"]
dev = ["pytest", "build123d", "schemdraw", "cairosvg", "pypdf", "gerbonara", "kiutils"]

[tool.setuptools]
py-modules = ["pcb", "schem", "vendor_parts", "fab"]
packages = ["pcb_footprints"]

[tool.setuptools.package-data]
pcb_footprints = ["*.pretty/*.kicad_mod"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
