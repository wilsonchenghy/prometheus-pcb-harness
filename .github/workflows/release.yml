name: release

# A tag vX.Y.Z, or a push to a branch release/vX.Y.Z (which makes the tag at that commit), makes the GitHub release:
# the notes are that version's section of CHANGELOG.md, and the files kept on the release-assets branch under
# X.Y.Z/ (the rendered release video, which is not in the code's history) are attached to it.
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version
        run: echo "V=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - name: notes from the changelog
        run: |
          v="${V}"
          awk -v h="## ${v} " 'index($0, h) == 1 {on=1; next} /^## v/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Prometheus ${v}" > notes.md
      - name: assets
        run: |
          mkdir -p assets
          if git fetch --depth 1 origin release-assets; then
            v="${V#v}"
            for f in $(git ls-tree --name-only "FETCH_HEAD:${v}" 2>/dev/null); do
              git show "FETCH_HEAD:${v}/${f}" > "assets/${f}"
            done
          fi
          ls -la assets
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${V}" >/dev/null 2>&1 || \
            gh release create "${V}" --target "${GITHUB_SHA}" --title "Prometheus ${V}" --notes-file notes.md
          if ls assets/* >/dev/null 2>&1; then gh release upload "${V}" assets/* --clobber; fi
          # (a release made earlier: its title kept to the name, and files no longer kept on release-assets taken off)
          gh release edit "${V}" --title "Prometheus ${V}"
          for f in $(gh release view "${V}" --json assets --jq '.assets[].name'); do
            test -e "assets/${f}" || gh release delete-asset "${V}" "${f}" --yes
          done
