name: release

# A tag vX.Y.Z makes the GitHub release: the notes are that version's section of CHANGELOG.md, and the files kept
# on the release-assets branch under X.Y.Z/ (the rendered release video, which is not in the code's history) are
# attached to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: notes from the changelog
        run: |
          v="${GITHUB_REF_NAME}"
          awk -v h="## ${v} " 'index($0, h) == 1 {on=1; next} /^## v/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "pcb-harness ${v}" > notes.md
      - name: assets
        run: |
          mkdir -p assets
          if git fetch --depth 1 origin release-assets; then
            v="${GITHUB_REF_NAME#v}"
            for f in $(git ls-tree --name-only "FETCH_HEAD:${v}" 2>/dev/null); do
              git show "FETCH_HEAD:${v}/${f}" > "assets/${f}"
            done
          fi
          ls -la assets
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "pcb-harness ${GITHUB_REF_NAME}" --notes-file notes.md
          if ls assets/* >/dev/null 2>&1; then gh release upload "${GITHUB_REF_NAME}" assets/* --clobber; fi
