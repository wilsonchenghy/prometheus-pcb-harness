<style>
/* Prometheus, in Pioneer's design system: the brand from its landing page (Rajdhani, the contour map; gold where it has
   orange), the working surfaces from its Studio (white panels, hairline rules, square corners, mono uppercase labels,
   ink and blueprint blue), renders on light grey with corner ticks and a white-glass tag */
:root {
  --bg: #f4f6f8; --panel: #ffffff; --line: #d3dae1; --line2: #e3e8ed; --hover: #f4f6f8; --tint: #eef3fa;
  --text: #18212b; --text2: #5a6774; --text3: #8a95a1; --ink: #18212b; --blue: #1f5fa8;
  --gold: #b9852c; --gold2: #e2b45c; --green: #237a4b; --red: #b3261e; --amber: #a5621a;
  --accent: #1f5fa8; --accent2: #1f5fa8;
  --ctext: #18212b; --ctext2: #5a6774; --ctext3: #8a95a1;
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --disp: "Rajdhani", "IBM Plex Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 400 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
#contour { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; } #contour.on { opacity: .9; }
.app { position: relative; z-index: 1; display: grid; height: 100%; grid-template-rows: 56px 1fr 28px; grid-template-columns: 260px 1fr 360px;
  grid-template-areas: "top top top" "left canvas right" "status status status"; transition: grid-template-columns .35s cubic-bezier(.2,.8,.2,1); }
.mono-label, .sec h3, h4, .verdict .k { font: 500 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--text2); }

/* the header: white, one hairline */
.top { grid-area: top; display: flex; align-items: center; gap: 18px; padding: 0 20px; border-bottom: 1px solid var(--line); background: #fff; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo img { width: 26px; height: 26px; }
.logo .wm { font: 700 22px/1 var(--disp); letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink); }
.logo .tag { font: 500 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: #8a5f19; padding: 4px 10px; border-radius: 999px;
  border: 1px solid #ecd6a8; background: #fbf4e4; margin-left: 2px; }
.crumb { color: var(--text3); display: flex; align-items: baseline; gap: 8px; font: 400 12px var(--mono); }
.crumb b { color: var(--text); font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.crumb .bsw { white-space: nowrap; cursor: pointer; border: 1px solid transparent; padding: 3px 6px; margin: -4px -6px; } .crumb .bsw:hover { border-color: var(--line); background: var(--tint); }
.crumb .bsw::after { content: " ▾"; color: var(--text3); font-size: 10px; }
.bmenu { position: absolute; z-index: 60; top: 50px; min-width: 300px; background: #fff; border: 1px solid var(--line); box-shadow: 0 18px 40px -18px rgba(17,24,39,.45); display: none; }
.bmenu.on { display: block; } .bmenu .h { padding: 9px 12px; font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--text2); border-bottom: 1px solid var(--line2); }
.bmenu a { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; border-bottom: 1px solid var(--line2); color: var(--text); text-decoration: none; cursor: pointer; }
.bmenu a:hover { background: var(--tint); } .bmenu a.cur { background: var(--hover); cursor: default; }
.bmenu a b { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; } .bmenu a small { color: var(--text2); font-size: 11px; }
.bmenu a .st { font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; align-self: center; } .bmenu a .st.ok { color: var(--green); } .bmenu a .st.bad { color: var(--red); }
.seg { margin: 0 auto; display: flex; gap: 0; border: 1px solid var(--line); background: #fff; }
.seg button { border: 0; border-right: 1px solid var(--line2); background: none; padding: 7px 18px; cursor: pointer; color: var(--text2); font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; transition: .12s; }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--blue); background: var(--tint); }
.seg button.on { background: var(--ink); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--line); background: #fff; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
.pill.ok { color: var(--green); } .pill.ok .dot { background: #2fa36b; }
.pill.bad { color: var(--red); } .pill.bad .dot { background: #d6453b; }
.pill.run { color: var(--gold); } .pill.run .dot { background: var(--gold); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.btn { cursor: pointer; padding: 7px 14px; background: #fff; border: 1px solid var(--blue); color: var(--blue); font-size: 12.5px; text-decoration: none; transition: .12s; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 500; }
.btn.primary:hover { background: linear-gradient(90deg, #b9852c, #d9aa52); border-color: #b9852c; color: #1d1406; }

/* panels: white, hairlines, square */
.left, .right { overflow: auto; background: #fff; }
.left { grid-area: left; border-right: 1px solid var(--line); }
.right { grid-area: right; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.sec { padding: 16px; border-bottom: 1px solid var(--line2); }
.sec h3 { margin: 0 0 10px; display: flex; justify-content: space-between; }
h4 { margin: 4px 0 10px; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; cursor: pointer; color: var(--text); user-select: none; border: 1px solid transparent; }
.row:hover { background: var(--tint); color: var(--blue); }
.row.off { opacity: .38; }
.sw { width: 11px; height: 11px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.row .eye { margin-left: auto; color: var(--text3); font-size: 11px; }
.search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); background: #fff; color: var(--text); font: 12px var(--sans); outline: none; margin-bottom: 8px; }
.search:focus { border-color: var(--blue); }
.net { font-family: var(--mono); font-size: 12px; } .net .w { margin-left: auto; color: var(--text3); font-size: 11px; }
.net.sel { background: var(--tint); color: var(--blue); border-color: #c9d8ee; }
.verdict { padding: 18px 18px 14px; border-bottom: 1px solid var(--line2); }
.verdict .v { font: 700 32px/1.02 var(--disp); margin-top: 8px; }
.verdict .v.ok { background: linear-gradient(90deg, #b9852c, #dcae58); -webkit-background-clip: text; background-clip: text; color: transparent; }
.verdict .v.bad { color: var(--red); } .verdict .v.run { color: var(--text2); }
.verdict .s { color: var(--text2); margin-top: 6px; font-size: 13px; }
/* the datasheet panel: the maker's PDF over the canvas, the cited text marked on its page */
.dsheet { position: absolute; inset: 14px; z-index: 30; display: none; flex-direction: column; background: #fff; border: 1px solid var(--line); box-shadow: 0 24px 60px -24px rgba(17,24,39,.45); }
.dsheet.on { display: flex; }
.dsheet.dock { left: auto; width: calc(48% - 14px); }
#schem.proof #ssvg { width: 52% !important; } #schem.proof .sevi { right: calc(48% + 18px); }
.dsstep { display: none; align-items: center; gap: 8px; } .dsheet.dock .dsstep { display: flex; } .dsheet.dock #dstitle { display: none; }
.dsstep b { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
.dsstep .st { font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--line); }
.dsstep .st.ok { color: var(--green); border-color: #c4e3d0; background: #e7f4ec; } .dsstep .st.bad { color: var(--red); border-color: #f3c6c3; background: #ffecec; } .dsstep .st.mute { color: var(--text3); }
.dsh-top { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 44px; border-bottom: 1px solid var(--line); flex: none; }
.dsh-top .k { font: 500 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--text2); }
.dsh-top .k b { color: var(--text); font-weight: 500; }
.dsh-top .sp { flex: 1; }
.dsh-top button { border: 1px solid var(--line); background: #fff; width: 28px; height: 26px; cursor: pointer; color: var(--text2); }
.dsh-top button:hover { background: var(--tint); color: var(--blue); }
.dsh-top a { font-size: 12px; color: var(--blue); text-decoration: none; }
.dsh-note { padding: 8px 14px; font-size: 12.5px; color: var(--text2); border-bottom: 1px solid var(--line2); flex: none; }
.dsh-note.ok { color: var(--green); } .dsh-note.warn { color: var(--amber); }
.dsh-note q { font-family: var(--mono); font-size: 12px; color: var(--text); }
.dsh-body { flex: 1; overflow: auto; background: #e9ecef; padding: 18px; }
.dsh-pagebox { position: relative; margin: 0 auto; width: max-content; box-shadow: 0 8px 30px -12px rgba(17,24,39,.4); }
.dsh-pagebox canvas { display: block; background: #fff; }
.dsh-pagebox { overflow: hidden; }
.dsmark { position: absolute; background: rgba(226,180,92,.32); border-bottom: 2px solid #b9852c; pointer-events: none; }
.dsmark.row { background: transparent; border: 0; border-radius: 4px; box-shadow: 0 0 0 2px #b9852c, 0 0 0 6px rgba(226,180,92,.28), 0 0 0 4000px rgba(24,33,43,.22); animation: dspulse 1.6s ease-out 1; }
@keyframes dspulse { 0% { box-shadow: 0 0 0 2px #b9852c, 0 0 0 18px rgba(226,180,92,0), 0 0 0 4000px rgba(24,33,43,0); } }
.dstag { position: absolute; transform: translateY(calc(-100% - 10px)); display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px; background: #fff; border: 1px solid #ecd6a8; box-shadow: 0 6px 18px -8px rgba(17,24,39,.45); font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #8a5f19; white-space: nowrap; pointer-events: none; }
.dstag i { width: 7px; height: 7px; border-radius: 50%; background: #c9a45f; }
.spin { cursor: pointer; transition: r .12s; } .spin:hover { stroke-width: .5; }
.evbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.evbar small { color: var(--text2); font-size: 11.5px; line-height: 1.35; }
.evh { font: 500 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--text2); margin: 16px 0 8px; display: flex; justify-content: space-between; }
.ev .st { font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.ev .st.ok { color: var(--green); } .ev .st.bad { color: var(--red); } .ev .st.mute { color: var(--text3); }

.ev { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 12px; margin-bottom: -1px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
.ev:hover { background: var(--tint); }
.ev .w { font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text2); }
.ev .x { color: var(--text); } .ev .pg { font: 500 11px var(--mono); color: var(--blue); align-self: center; }
.ev q { grid-column: 1 / -1; font: 12px var(--mono); color: var(--text2); }
.tabs2 { display: flex; padding: 0 12px; border-bottom: 1px solid var(--line); }
.tabs2 button { border: 0; background: none; padding: 11px 10px 10px; cursor: pointer; color: var(--text2); font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs2 button.on { color: var(--text); border-bottom-color: var(--ink); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; font: 500 10.5px/16px var(--mono); text-align: center; background: var(--hover); color: var(--text2); border: 1px solid var(--line2); }
.badge.r { background: #ffecec; color: var(--red); border-color: #f3c6c3; } .badge.g { background: #e7f4ec; color: var(--green); border-color: #c4e3d0; }
.pane { display: none; padding: 14px 16px; overflow: auto; flex: 1; } .pane.on { display: block; }
.issue { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 11px 12px; cursor: pointer; margin-bottom: -1px; background: #fff; border: 1px solid var(--line); transition: background .12s; }
.issue:hover { background: var(--hover); }
.issue .w { margin-top: 5px; font-size: 11.5px; line-height: 1.45; color: var(--text3); }
.issue.sel { background: var(--tint); border-color: var(--blue); position: relative; z-index: 1; }
.num { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); background: #ffecec; color: var(--red); }
.issue.warn .num { background: #fbf1e3; color: var(--amber); } .issue.info .num { background: var(--hover); color: var(--text3); }
.issue .k { font: 500 10px var(--mono); letter-spacing: .14em; color: var(--text2); text-transform: uppercase; }
.issue .x { color: var(--text); margin-top: 2px; }
.issue .h { color: var(--text2); font-size: 12px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.empty { text-align: center; padding: 18px 10px; color: var(--text2); }
.empty b { display: block; color: var(--text); font: 700 20px var(--disp); margin-bottom: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0; font-size: 12px; margin-bottom: 18px; border-top: 1px solid var(--line2); }
.kv span, .kv b { padding: 7px 0; border-bottom: 1px solid var(--line2); }
.kv span { color: var(--text2); font: 400 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.kv b { font-weight: 500; text-align: right; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl { margin-bottom: 18px; font-family: var(--mono); }
.tl .s { display: grid; grid-template-columns: 96px 1fr 58px; gap: 10px; align-items: center; font-size: 11px; margin: 8px 0; color: var(--text2); text-transform: uppercase; letter-spacing: .1em; }
.tl .s .b { height: 4px; background: var(--line2); overflow: hidden; }
.tl .s .b i { display: block; height: 100%; background: var(--ink); }
.tl .s em { font-style: normal; text-align: right; color: var(--text); letter-spacing: 0; }
.file { display: flex; align-items: center; gap: 10px; padding: 8px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--line2); }
.file:hover { background: var(--tint); color: var(--blue); }
.file .ic { width: 34px; height: 28px; display: flex; align-items: center; justify-content: center; font: 600 8.5px var(--mono); background: var(--hover); color: var(--text2); border: 1px solid var(--line); }
.file small { display: block; color: var(--text2); font-size: 11px; }

/* the viewport: a render on light grey, framed by corner ticks, tagged in white glass */
.canvas { grid-area: canvas; position: relative; overflow: hidden; margin: 16px; border-radius: 16px; border: 1px solid #e5e7eb;
  background: radial-gradient(circle at 1px 1px, rgba(24,33,43,.06) 1px, transparent 1.2px) 0 0 / 22px 22px, radial-gradient(90% 80% at 50% 40%, #f1f2f3, #dcdee1);
  box-shadow: 0 30px 80px -30px rgba(17,24,39,.45); color: var(--text); }
.brk { position: absolute; width: 16px; height: 16px; z-index: 6; pointer-events: none; border-color: rgba(156,163,175,.8); }

// ---------- the contour map behind the app (a drifting height field drawn like a topo map; gold near the cursor) ----------
(function contour() {
  const cv = $("#contour"), gl = cv.getContext("webgl", { premultipliedAlpha: true, alpha: true }); if (!gl) return;
  const vsrc = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
  const fsrc = `precision highp float; uniform float uT; uniform vec2 uR; uniform vec2 uM;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
  float fbm(vec2 p){ float v = 0.0, a = 0.5; mat2 r = mat2(0.8,0.6,-0.6,0.8); for (int i = 0; i < 4; i++){ v += a*noise(p); p = r*p*2.02; a *= 0.5; } return v; }
  float field(vec2 p){ vec2 q = vec2(fbm(p + vec2(0.0, uT*0.035)), fbm(p + vec2(5.2,1.3) - uT*0.025)); return fbm(p + 1.6*q); }
  void main(){ vec2 fr = gl_FragCoord.xy; float sc = 2.2 / min(uR.x, uR.y); vec2 p = fr*sc; float e = sc;
    float h = field(p), hx = field(p+vec2(e,0.0)), hy = field(p+vec2(0.0,e)); float g = length(vec2(hx-h, hy-h)) + 1e-5;
    float L = 13.0, v = h*L, d = abs(fract(v-0.5)-0.5)/(g*L); float idx = step(0.5, 1.0 - abs(mod(floor(v+0.5), 5.0)));
    float w = mix(0.55, 1.05, idx), line = 1.0 - smoothstep(w, w+1.0, d);
    float m = exp(-pow(length(fr - uM)/(0.22*min(uR.x, uR.y)), 2.0));
    vec3 ink = mix(vec3(0.42,0.44,0.48), vec3(0.18,0.19,0.22), idx), warm = vec3(0.80,0.58,0.20);
    vec3 col = mix(ink, warm, m); float a = line * mix(0.16, 0.28, idx) * (1.0 + 2.2*m); gl_FragColor = vec4(col*a, a); }`;
  const mk = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, mk(gl.VERTEX_SHADER, vsrc)); gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, fsrc)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return; gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uT = gl.getUniformLocation(pr, "uT"), uR = gl.getUniformLocation(pr, "uR"), uM = gl.getUniformLocation(pr, "uM");
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5), mouse = { x: -1e4, y: -1e4, tx: -1e4, ty: -1e4 };
  const size = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px"; gl.viewport(0, 0, cv.width, cv.height); };
  size(); addEventListener("resize", size);
  addEventListener("pointermove", e => { mouse.tx = e.clientX * dpr; mouse.ty = (innerHeight - e.clientY) * dpr; });
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches, t0 = performance.now();
  const frame = (t) => { mouse.x += (mouse.tx - mouse.x) * .08; mouse.y += (mouse.ty - mouse.y) * .08;
    gl.uniform1f(uT, still ? 0 : (t - t0) / 1000); gl.uniform2f(uR, cv.width, cv.height); gl.uniform2f(uM, mouse.x, mouse.y);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3); if (!still) requestAnimationFrame(frame); };
  requestAnimationFrame(frame); setTimeout(() => cv.classList.add("on"), 150);
})();

// ---------- pan / zoom ----------
function panZoom(svg, onChange) {
  // a gesture moves the drawn picture on the GPU (a CSS transform from the drawn view to the live one) and redraws it
  // sharp once the gesture rests: a viewBox change re-renders every path (a 3 MB sheet, 10 000 copper shapes) per event
  // (a picture that redraws inside a couple of frames - most boards - is redrawn sharp on every frame instead: the GPU
  // copy shows blank margins zooming out and a blur zooming in until the gesture rests)
  const st = { vb: [0, 0, 100, 100] }; let base = null, box = null, idle = 0, raf = 0, cheap = true;
  const rect = () => base ? box : (box = svg.getBoundingClientRect());
  const timed = () => { const t0 = performance.now(); requestAnimationFrame(() => requestAnimationFrame(() => { cheap = performance.now() - t0 < 50; })); };
  const draw = () => { base = null; svg.style.transform = ""; svg.style.willChange = ""; svg.setAttribute("viewBox", st.vb.join(" ")); timed(); if (onChange) onChange(st.vb); };
  const apply = () => { svg.setAttribute("viewBox", st.vb.join(" ")); base = null; svg.style.transform = ""; timed(); if (onChange) onChange(st.vb); };

async function loadAll() {
  R = await getJ("/api/result"); B = await getJ("/api/board"); SHEETS = null; for (const k in EV) delete EV[k]; EVC = null;
  $("#msg").textContent = !B || B.error ? ((B && B.error) || "No board yet") : "";
  drawHeader(); drawLayers(); drawNets(); drawChecks(); drawRun(); drawFiles(); drawEvidence(); drawLayout(); fitLayout();
  if (activeView() === "schem") drawSchem(); if (activeView() === "parts") drawParts(); if (threeReady) build3d();
}
let wasRunning = false, snap = null;
async function poll() {
  P = await getJ("/api/progress"); drawHeader();
  if (P && !P.done && P.snap !== snap) { snap = P.snap;          // (the board as the run first wrote it: the live picture
    if (snap && !LV.on) { await loadAll();                       //  starts from it)
      if (P.live && B && !B.error && !LV.replay) { lvStart(B); $$(".tabs2 button")[0].click(); } } }
  if (P && !P.done) wasRunning = true; else if (wasRunning) { wasRunning = false; snap = null; if (!LV.replay) { lvStop(); await loadAll(); drawLive(); } }
  setTimeout(poll, P && !P.done ? 500 : 4000);
}
(async () => { P = await getJ("/api/progress"); conInit(); await loadAll(); poll(); pollLive(); pollEvents(); })();
window.addEventListener("resize", fitLayout);
let pW = 0; new ResizeObserver(([e]) => { const w = Math.round(e.contentRect.width);     // (the cards fit the panel as it
  if (w && w !== pW && activeView() === "parts") { pW = w; drawParts(); } }).observe($("#psvg"));   // settles, not a frame late)
window.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return;
  if (e.key === "f") fitLayout(true); if (e.key === "`") setCon(!LV.conOpen); for (const i of [1, 2, 3, 4]) if (e.key === String(i)) $$("#seg button")[i - 1].click();
  if (e.key === "Escape") { selectNet(null); setLoupe(false); proof ? closeProof() : $("#dsheet").classList.remove("on"); }
  if (e.key === "l" && activeView() === "layout") setLoupe(!loupeOn);
  if (e.key === "e" && activeView() === "v3d") $("#explode").click(); });
</script>
