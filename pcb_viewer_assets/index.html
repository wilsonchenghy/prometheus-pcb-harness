<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pcb-harness viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='%23f5a524'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts.css">
<style>
:root {
  --bg: #0a0b0d; --bg2: #0e1013; --panel: #121418; --panel2: #171a1f; --hover: #1d2127; --line: #22262d; --line2: #2c3139;
  --text: #e8eaed; --text2: #a3a9b3; --text3: #6b727d;
  --amber: #f5a524; --amber2: #ffcf7a; --cyan: #3ec7e8; --green: #3ddc97; --red: #ff5d5d; --violet: #8b7cff;
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 400 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.app { display: grid; height: 100%; grid-template-rows: 48px 1fr 26px; grid-template-columns: 232px 1fr 328px;
  grid-template-areas: "top top top" "left canvas right" "status status status"; }

/* top bar */
.top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 500; letter-spacing: .2px; }
.logo svg { width: 22px; height: 22px; }
.crumb { color: var(--text3); display: flex; align-items: center; gap: 8px; font-size: 13px; }
.crumb b { color: var(--text); font-weight: 500; }
.seg { margin: 0 auto; display: flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { border: 0; background: none; padding: 5px 16px; border-radius: 7px; cursor: pointer; color: var(--text2); font-weight: 500; transition: .15s; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--hover); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 0 0 1px var(--line2); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 999px; font-weight: 500; font-size: 12px;
  background: var(--panel); box-shadow: inset 0 0 0 1px var(--line2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); }
.pill.ok .dot { background: var(--green); box-shadow: 0 0 10px var(--green); } .pill.bad .dot { background: var(--red); box-shadow: 0 0 10px var(--red); }
.pill.run .dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.btn { border: 0; cursor: pointer; padding: 6px 12px; border-radius: 7px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line2); font-weight: 500; font-size: 12px; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--hover); }
.btn.primary { background: linear-gradient(180deg, #f7b13c, #e8940f); color: #1a1100; box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 4px 14px rgba(245,165,36,.25); }

/* side panels */
.left, .right { background: var(--bg2); overflow: auto; }
.left { grid-area: left; border-right: 1px solid var(--line); }
.right { grid-area: right; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.sec { padding: 14px 12px 6px; }
.sec h3 { margin: 0 0 8px; padding: 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text3); display: flex; justify-content: space-between; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer; color: var(--text2); user-select: none; }
.row:hover { background: var(--panel2); color: var(--text); }
.row.off { opacity: .4; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.row .eye { margin-left: auto; color: var(--text3); font-size: 11px; }
.search { width: 100%; padding: 6px 9px; border-radius: 7px; border: 0; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); font: 12px var(--sans); outline: none; margin-bottom: 6px; }
.search:focus { box-shadow: inset 0 0 0 1px var(--amber); }
.net { font-family: var(--mono); font-size: 12px; }
.net .w { margin-left: auto; color: var(--text3); font-size: 11px; }
.net.sel { background: rgba(245,165,36,.1); color: var(--amber2); }

.tabs2 { display: flex; gap: 2px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); }
.tabs2 button { border: 0; background: none; padding: 8px 10px; cursor: pointer; color: var(--text3); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs2 button.on { color: var(--text); border-bottom-color: var(--amber); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; font-size: 10.5px; line-height: 16px; text-align: center; background: var(--panel2); color: var(--text2); }
.badge.r { background: rgba(255,93,93,.15); color: var(--red); } .badge.g { background: rgba(61,220,151,.12); color: var(--green); }
.pane { display: none; padding: 12px; overflow: auto; flex: 1; } .pane.on { display: block; }
.issue { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px; border-radius: 9px; cursor: pointer; margin-bottom: 6px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); transition: .15s; }
.issue:hover { box-shadow: inset 0 0 0 1px var(--line2); background: var(--panel2); }
.issue.sel { box-shadow: inset 0 0 0 1px var(--amber); }
.num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); background: rgba(255,93,93,.15); color: var(--red); }
.issue.warn .num { background: rgba(245,165,36,.14); color: var(--amber); } .issue.info .num { background: var(--panel2); color: var(--text3); }
.issue .k { font-size: 11px; color: var(--text3); text-transform: capitalize; }
.issue .x { color: var(--text); margin-top: 1px; }
.issue .h { color: var(--text2); font-size: 12px; margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--line2); }
.empty { text-align: center; padding: 26px 10px 18px; color: var(--text2); }
.empty svg { width: 64px; height: 64px; margin-bottom: 8px; }
.empty b { display: block; color: var(--text); font-size: 14px; font-weight: 500; margin-bottom: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; font-size: 12px; margin-bottom: 16px; }
.kv span { color: var(--text3); } .kv b { font-weight: 500; text-align: right; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl { margin-bottom: 16px; }
.tl .s { display: grid; grid-template-columns: 92px 1fr 58px; gap: 10px; align-items: center; font-size: 12px; margin: 7px 0; color: var(--text2); }
.tl .s .b { height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.tl .s .b i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--amber), var(--amber2)); }
.tl .s em { font-style: normal; text-align: right; font-family: var(--mono); color: var(--text); font-size: 11.5px; }
.file { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; text-decoration: none; color: var(--text); }
.file:hover { background: var(--panel2); }
.file .ic { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font: 600 8.5px var(--mono); background: var(--panel2); color: var(--text2); box-shadow: inset 0 0 0 1px var(--line2); }
.file small { display: block; color: var(--text3); font-size: 11px; }
h4 { margin: 4px 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text3); }

/* canvas */
.canvas { grid-area: canvas; position: relative; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.055) 1px, transparent 1.2px) 0 0 / 22px 22px, radial-gradient(80% 70% at 50% 45%, #111419, #0a0b0d); }
.aura { position: absolute; inset: -20%; pointer-events: none; filter: blur(80px); opacity: .5;
  background: radial-gradient(30% 30% at 35% 40%, rgba(245,165,36,.12), transparent 70%), radial-gradient(30% 30% at 65% 60%, rgba(62,199,232,.10), transparent 70%);
  animation: drift 18s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(4%, -3%) scale(1.06); } }
.view { position: absolute; inset: 0; display: none; } .view.on { display: block; }
svg.pan { width: 100%; height: 100%; display: block; cursor: grab; } svg.pan.drag { cursor: grabbing; }
.float { position: absolute; z-index: 5; border-radius: var(--r); background: rgba(18,20,24,.78); backdrop-filter: blur(14px) saturate(1.3);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 10px 30px rgba(0,0,0,.45); }
.tools { left: 14px; bottom: 14px; display: flex; padding: 4px; gap: 2px; }
.tools button { border: 0; background: none; width: 32px; height: 30px; border-radius: 7px; cursor: pointer; color: var(--text2); font-size: 15px; display: flex; align-items: center; justify-content: center; }
.tools button:hover { background: var(--hover); color: var(--text); }
.tools .sep { width: 1px; background: var(--line2); margin: 5px 3px; }
.tools button.on { color: var(--amber); }
.looks { right: 14px; bottom: 14px; display: flex; padding: 4px; gap: 2px; }
.looks button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--text2); font-weight: 500; font-size: 12px; }
.looks button.on { background: var(--hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }

/* progress card */
.prog { left: 50%; top: 18px; transform: translateX(-50%); display: none; align-items: center; gap: 16px; padding: 14px 20px 14px 14px; min-width: 380px; }
.prog.on { display: flex; animation: rise .4s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, -8px); } }
.ring { width: 54px; height: 54px; flex: none; }
.prog .t1 { font-weight: 500; font-size: 14px; }
.prog .t2 { color: var(--text2); font-size: 12px; margin-top: 2px; }
.prog .eta { margin-left: auto; text-align: right; }
.prog .eta b { display: block; font: 300 26px/1 var(--sans); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.prog .eta span { color: var(--text3); font-size: 11px; }
.prog .line { position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.05); }
.prog .line i { display: block; height: 100%; background: linear-gradient(90deg, transparent, var(--amber), var(--amber2)); transition: width .8s; }
.canvas.running svg.pan, .canvas.running #three { filter: saturate(.6) brightness(.7); transition: filter .6s; }
.shimmer { position: absolute; inset: 0; pointer-events: none; display: none; background: linear-gradient(105deg, transparent 40%, rgba(245,165,36,.06) 50%, transparent 60%); background-size: 250% 100%; animation: sweep 2.4s linear infinite; }
.canvas.running .shimmer { display: block; }
@keyframes sweep { from { background-position: 150% 0; } to { background-position: -100% 0; } }

/* status bar */
.status { grid-area: status; display: flex; align-items: center; gap: 18px; padding: 0 14px; border-top: 1px solid var(--line); background: var(--bg2); font: 400 11.5px var(--mono); color: var(--text3); }
.status b { color: var(--text2); font-weight: 400; }
.status .r { margin-left: auto; display: flex; gap: 18px; }

#tip { position: fixed; pointer-events: none; z-index: 40; display: none; padding: 6px 10px; border-radius: 7px; font-size: 12px;
  background: rgba(14,16,19,.96); box-shadow: inset 0 0 0 1px var(--line2), 0 8px 24px rgba(0,0,0,.5); max-width: 420px; }
#tip .m { font-family: var(--mono); color: var(--amber2); }
#msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--text3); pointer-events: none; text-align: center; }
#render { position: absolute; inset: 0; display: none; background: #000; } #render img { width: 100%; height: 100%; object-fit: contain; }
.flow { stroke-dasharray: 0.6 0.9; animation: flow .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -1.5; } }
.netdim { opacity: .18; transition: opacity .2s; }
.pin { cursor: pointer; }
.pin circle.halo { animation: halo 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; border: 3px solid var(--bg2); }
@media (max-width: 1000px) { .app { grid-template-columns: 0 1fr 300px; } .left { display: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcf7a"/><stop offset="1" stop-color="#e8940f"/></linearGradient></defs>
      <rect x="5" y="5" width="14" height="14" rx="3" fill="url(#lg)"/><g stroke="#ffcf7a" stroke-width="1.6" stroke-linecap="round"><path d="M9 5V2M15 5V2M9 22v-3M15 22v-3M5 9H2M5 15H2M22 9h-3M22 15h-3"/></g>
      <rect x="9" y="9" width="6" height="6" rx="1.2" fill="#1a1100" opacity=".55"/></svg>pcb-harness</div>
    <div class="crumb">/ <span id="folder">board</span> / <b id="name">—</b></div>
    <div class="seg" id="seg"><button class="on" data-v="layout">Layout</button><button data-v="v3d">3D</button><button data-v="schem">Schematic</button></div>
    <span class="pill" id="pill"><span class="dot"></span><span id="pilltext">Loading</span></span>
    <a class="btn" id="report" href="/files/report.html" target="_blank">Report</a>
    <a class="btn primary" id="gerbers" href="/files/gerbers.zip">Download Gerbers</a>
  </div>

  <div class="left">
    <div class="sec"><h3>Layers</h3><div id="layers"></div></div>
    <div class="sec"><h3>Nets <span id="ncount"></span></h3><input class="search" id="nsearch" placeholder="Filter nets"><div id="nets"></div></div>
  </div>

  <div class="canvas" id="canvas">
    <div class="aura"></div>
    <div class="view on" id="layout"><svg id="lsvg" class="pan"></svg></div>
    <div class="view" id="v3d"><div id="three" style="position:absolute;inset:0"></div><div class="float" id="mtagbox" style="left:14px;top:14px;padding:6px 11px;font-size:12px;color:var(--text2)"><span id="mtag"></span></div><div id="render"><img id="rimg" alt="KiCad 3D render"></div></div>
    <div class="view" id="schem"><svg id="ssvg" class="pan"></svg></div>
    <div class="shimmer"></div>
    <div class="float prog" id="prog">
      <svg class="ring" viewBox="0 0 54 54"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcf7a"/><stop offset="1" stop-color="#f5a524"/></linearGradient></defs>
        <circle cx="27" cy="27" r="22" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="4"/>
        <circle id="ringarc" cx="27" cy="27" r="22" fill="none" stroke="url(#rg)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 27 27)" stroke-dasharray="0 140" style="transition:stroke-dasharray .8s; filter:drop-shadow(0 0 4px rgba(245,165,36,.6))"/>
        <text id="ringpct" x="27" y="31" text-anchor="middle" fill="#e8eaed" font-size="11" font-family="IBM Plex Mono">0%</text></svg>
      <div><div class="t1" id="pt1">Routing</div><div class="t2" id="pt2"></div></div>
      <div class="eta"><b id="peta">—</b><span>left, about</span></div>
      <div class="line"><i id="pline" style="width:0"></i></div>
    </div>
    <div class="float tools" id="tools">
      <button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="fit" title="Fit">⤢</button>
      <div class="sep"></div><button id="flip" title="View from below">⇅</button><button id="krender" title="KiCad photoreal render" style="display:none">◐</button>
    </div>
    <div class="float looks" id="looks"><button class="on" data-m="glow">Light</button><button data-m="board">As made</button><button data-m="xray">Layers</button></div>
    <div id="msg"></div>
  </div>

  <div class="right">
    <div class="tabs2"><button class="on" data-p="checks">Checks<span class="badge" id="bchecks">0</span></button><button data-p="run">Run</button><button data-p="files">Outputs</button></div>
    <div class="pane on" id="p-checks"><div id="checks"></div></div>
    <div class="pane" id="p-run"><div id="runp"></div></div>
    <div class="pane" id="p-files"><div id="files"></div></div>
  </div>

  <div class="status"><span>x <b id="cx">—</b></span><span>y <b id="cy">—</b></span><span>zoom <b id="zm">—</b></span>
    <div class="r"><span id="srouter"></span><span id="skicad"></span><span id="stime"></span></div></div>
</div>
<div id="tip"></div>

<script src="/GLTFLoader.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const NS = "http://www.w3.org/2000/svg";
const el = (tag, a = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; };
const FONT = "IBM Plex Mono";
let B = null, R = null, P = null, flipped = false, look = "glow", threeReady = false, selNet = null;
const layerOn = { F: true, B: true, pads: true, vias: true, silk: true, court: false, pins: true };
const COLOR = { F: "#f5a524", B: "#3ec7e8" };
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
const hideTip = () => tip.style.display = "none";
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const secs = (s) => s == null ? "—" : (s < 10 ? s.toFixed(2) : s.toFixed(1)) + " s";
const clock = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

// ---------- views and panes ----------
$$("#seg button").forEach(b => b.onclick = () => {
  $$("#seg button").forEach(x => x.classList.toggle("on", x === b));
  $$(".view").forEach(v => v.classList.toggle("on", v.id === b.dataset.v));
  $("#looks").style.display = b.dataset.v === "layout" ? "" : "none";
  $("#krender").style.display = b.dataset.v === "v3d" ? "" : "none";
  $("#flip").style.display = b.dataset.v === "layout" ? "" : "none";
  if (b.dataset.v === "v3d") init3d(); if (b.dataset.v === "schem") drawSchem(); if (b.dataset.v === "layout") fitLayout();
});
$$(".tabs2 button").forEach(b => b.onclick = () => { $$(".tabs2 button").forEach(x => x.classList.toggle("on", x === b)); $$(".pane").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.p)); });
$$("#looks button").forEach(b => b.onclick = () => { look = b.dataset.m; $$("#looks button").forEach(x => x.classList.toggle("on", x === b)); drawLayout(); });
const activeView = () => $$(".view").find(v => v.classList.contains("on")).id;

// ---------- pan / zoom ----------
function panZoom(svg, onChange) {
  const st = { vb: [0, 0, 100, 100] };
  const apply = () => { svg.setAttribute("viewBox", st.vb.join(" ")); if (onChange) onChange(st.vb); };
  st.set = (x, y, w, h, anim) => { const r = svg.getBoundingClientRect(), a = (r.width || 800) / (r.height || 600);
    if (w / h < a) { const nw = h * a; x -= (nw - w) / 2; w = nw; } else { const nh = w / a; y -= (nh - h) / 2; h = nh; }
    if (!anim) { st.vb = [x, y, w, h]; apply(); return; }
    const from = st.vb.slice(), to = [x, y, w, h], t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 450), e = 1 - Math.pow(1 - k, 3); st.vb = from.map((v, i) => v + (to[i] - v) * e); apply(); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); };
  st.zoom = (k) => { const [x, y, w, h] = st.vb; st.set(x + w * (1 - k) / 2, y + h * (1 - k) / 2, w * k, h * k, true); };
  svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(), k = Math.exp(e.deltaY * 0.0015), [x, y, w, h] = st.vb;
    const px = x + (e.clientX - r.left) / r.width * w, py = y + (e.clientY - r.top) / r.height * h;
    st.vb = [px - (px - x) * k, py - (py - y) * k, w * k, h * k]; apply(); }, { passive: false });
  let d = null;
  svg.addEventListener("pointerdown", e => { d = [e.clientX, e.clientY, ...st.vb]; svg.classList.add("drag"); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove", e => { const r = svg.getBoundingClientRect();
    if (onChange) { const [x, y, w, h] = st.vb; const mx = x + (e.clientX - r.left) / r.width * w, my = y + (e.clientY - r.top) / r.height * h;
