<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeus · AI PCB Harness</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M13.6 2 4.8 13.4h5.6L9.2 22l9.9-12.6h-6L13.6 2z' fill='%23d4b373'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts.css">
<style>
/* Zeus, in Pioneer's design system: the brand from its landing page (Rajdhani, the contour map; gold where it has
   orange), the working surfaces from its Studio (white panels, hairline rules, square corners, mono uppercase labels,
   ink and blueprint blue), renders on light grey with corner ticks and a white-glass tag */
:root {
  --bg: #f4f6f8; --panel: #ffffff; --line: #d3dae1; --line2: #e3e8ed; --hover: #f4f6f8; --tint: #eef3fa;
  --text: #18212b; --text2: #5a6774; --text3: #8a95a1; --ink: #18212b; --blue: #1f5fa8;
  --gold: #b9852c; --gold2: #e2b45c; --green: #237a4b; --red: #b3261e; --amber: #a5621a;
  --accent: #1f5fa8; --accent2: #1f5fa8;
  --ctext: #18212b; --ctext2: #5a6774; --ctext3: #8a95a1;
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --disp: "Rajdhani", "IBM Plex Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 400 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
#contour { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; } #contour.on { opacity: .9; }
.app { position: relative; z-index: 1; display: grid; height: 100%; grid-template-rows: 56px 1fr 28px; grid-template-columns: 260px 1fr 360px;
  grid-template-areas: "top top top" "left canvas right" "status status status"; transition: grid-template-columns .35s cubic-bezier(.2,.8,.2,1); }
.mono-label, .sec h3, h4, .verdict .k { font: 500 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--text2); }

/* the header: white, one hairline */
.top { grid-area: top; display: flex; align-items: center; gap: 18px; padding: 0 20px; border-bottom: 1px solid var(--line); background: #fff; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo svg { width: 24px; height: 24px; filter: drop-shadow(0 1px 2px rgba(185,133,44,.35)); }
.logo .wm { font: 700 22px/1 var(--disp); letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink); }
.logo .tag { font: 500 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: #8a5f19; padding: 4px 10px; border-radius: 999px;
  border: 1px solid #ecd6a8; background: #fbf4e4; margin-left: 2px; }
.crumb { color: var(--text3); display: flex; align-items: baseline; gap: 8px; font: 400 12px var(--mono); }
.crumb b { color: var(--text); font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.seg { margin: 0 auto; display: flex; gap: 0; border: 1px solid var(--line); background: #fff; }
.seg button { border: 0; border-right: 1px solid var(--line2); background: none; padding: 7px 18px; cursor: pointer; color: var(--text2); font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; transition: .12s; }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--blue); background: var(--tint); }
.seg button.on { background: var(--ink); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--line); background: #fff; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
.pill.ok { color: var(--green); } .pill.ok .dot { background: #2fa36b; }
.pill.bad { color: var(--red); } .pill.bad .dot { background: #d6453b; }
.pill.run { color: var(--gold); } .pill.run .dot { background: var(--gold); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.btn { cursor: pointer; padding: 7px 14px; background: #fff; border: 1px solid var(--blue); color: var(--blue); font-size: 12.5px; text-decoration: none; transition: .12s; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 500; }
.btn.primary:hover { background: linear-gradient(90deg, #b9852c, #d9aa52); border-color: #b9852c; color: #1d1406; }

/* panels: white, hairlines, square */
.left, .right { overflow: auto; background: #fff; }
.left { grid-area: left; border-right: 1px solid var(--line); }
.right { grid-area: right; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.sec { padding: 16px; border-bottom: 1px solid var(--line2); }
.sec h3 { margin: 0 0 10px; display: flex; justify-content: space-between; }
h4 { margin: 4px 0 10px; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; cursor: pointer; color: var(--text); user-select: none; border: 1px solid transparent; }
.row:hover { background: var(--tint); color: var(--blue); }
.row.off { opacity: .38; }
.sw { width: 11px; height: 11px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.row .eye { margin-left: auto; color: var(--text3); font-size: 11px; }
.search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); background: #fff; color: var(--text); font: 12px var(--sans); outline: none; margin-bottom: 8px; }
.search:focus { border-color: var(--blue); }
.net { font-family: var(--mono); font-size: 12px; } .net .w { margin-left: auto; color: var(--text3); font-size: 11px; }
.net.sel { background: var(--tint); color: var(--blue); border-color: #c9d8ee; }
.verdict { padding: 18px 18px 14px; border-bottom: 1px solid var(--line2); }
.verdict .v { font: 700 32px/1.02 var(--disp); margin-top: 8px; }
.verdict .v.ok { background: linear-gradient(90deg, #b9852c, #dcae58); -webkit-background-clip: text; background-clip: text; color: transparent; }
.verdict .v.bad { color: var(--red); } .verdict .v.run { color: var(--text2); }
.verdict .s { color: var(--text2); margin-top: 6px; font-size: 13px; }
.tabs2 { display: flex; padding: 0 12px; border-bottom: 1px solid var(--line); }
.tabs2 button { border: 0; background: none; padding: 11px 10px 10px; cursor: pointer; color: var(--text2); font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs2 button.on { color: var(--text); border-bottom-color: var(--ink); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; font: 500 10.5px/16px var(--mono); text-align: center; background: var(--hover); color: var(--text2); border: 1px solid var(--line2); }
.badge.r { background: #ffecec; color: var(--red); border-color: #f3c6c3; } .badge.g { background: #e7f4ec; color: var(--green); border-color: #c4e3d0; }
.pane { display: none; padding: 14px 16px; overflow: auto; flex: 1; } .pane.on { display: block; }
.issue { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 11px 12px; cursor: pointer; margin-bottom: -1px; background: #fff; border: 1px solid var(--line); transition: background .12s; }
.issue:hover { background: var(--hover); }
.issue.sel { background: var(--tint); border-color: var(--blue); position: relative; z-index: 1; }
.num { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); background: #ffecec; color: var(--red); }
.issue.warn .num { background: #fbf1e3; color: var(--amber); } .issue.info .num { background: var(--hover); color: var(--text3); }
.issue .k { font: 500 10px var(--mono); letter-spacing: .14em; color: var(--text2); text-transform: uppercase; }
.issue .x { color: var(--text); margin-top: 2px; }
.issue .h { color: var(--text2); font-size: 12px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.empty { text-align: center; padding: 18px 10px; color: var(--text2); }
.empty b { display: block; color: var(--text); font: 700 20px var(--disp); margin-bottom: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0; font-size: 12px; margin-bottom: 18px; border-top: 1px solid var(--line2); }
.kv span, .kv b { padding: 7px 0; border-bottom: 1px solid var(--line2); }
.kv span { color: var(--text2); font: 400 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.kv b { font-weight: 500; text-align: right; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl { margin-bottom: 18px; font-family: var(--mono); }
.tl .s { display: grid; grid-template-columns: 96px 1fr 58px; gap: 10px; align-items: center; font-size: 11px; margin: 8px 0; color: var(--text2); text-transform: uppercase; letter-spacing: .1em; }
.tl .s .b { height: 4px; background: var(--line2); overflow: hidden; }
.tl .s .b i { display: block; height: 100%; background: var(--ink); }
.tl .s em { font-style: normal; text-align: right; color: var(--text); letter-spacing: 0; }
.file { display: flex; align-items: center; gap: 10px; padding: 8px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--line2); }
.file:hover { background: var(--tint); color: var(--blue); }
.file .ic { width: 34px; height: 28px; display: flex; align-items: center; justify-content: center; font: 600 8.5px var(--mono); background: var(--hover); color: var(--text2); border: 1px solid var(--line); }
.file small { display: block; color: var(--text2); font-size: 11px; }

/* the viewport: a render on light grey, framed by corner ticks, tagged in white glass */
.canvas { grid-area: canvas; position: relative; overflow: hidden; margin: 16px; border-radius: 16px; border: 1px solid #e5e7eb;
  background: radial-gradient(circle at 1px 1px, rgba(24,33,43,.06) 1px, transparent 1.2px) 0 0 / 22px 22px, radial-gradient(90% 80% at 50% 40%, #f1f2f3, #dcdee1);
  box-shadow: 0 30px 80px -30px rgba(17,24,39,.45); color: var(--text); }
.brk { position: absolute; width: 16px; height: 16px; z-index: 6; pointer-events: none; border-color: rgba(156,163,175,.8); }
.brk.tl { left: 12px; top: 12px; border-left: 1px solid; border-top: 1px solid; } .brk.tr { right: 12px; top: 12px; border-right: 1px solid; border-top: 1px solid; }
.brk.bl { left: 12px; bottom: 12px; border-left: 1px solid; border-bottom: 1px solid; } .brk.br { right: 12px; bottom: 12px; border-right: 1px solid; border-bottom: 1px solid; }
.vtag { position: absolute; left: 20px; top: 16px; z-index: 6; font: 500 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: #4b5563;
  background: rgba(255,255,255,.7); padding: 3px 7px; border-radius: 4px; backdrop-filter: blur(6px); pointer-events: none; }
.vtag b { color: #4b5563; font-weight: 500; }
.aura { display: none; }
.view { position: absolute; inset: 0; display: none; } .view.on { display: block; }
svg.pan { width: 100%; height: 100%; display: block; cursor: grab; } svg.pan.drag { cursor: grabbing; }
.float { position: absolute; z-index: 5; background: rgba(255,255,255,.88); backdrop-filter: blur(10px); border: 1px solid var(--line); color: var(--text); }
.tools { left: 18px; bottom: 18px; display: flex; }
.tools button { border: 0; border-right: 1px solid var(--line2); background: none; width: 34px; height: 32px; cursor: pointer; color: var(--text2); font-size: 15px; display: flex; align-items: center; justify-content: center; }
.tools button:last-child { border-right: 0; }
.tools button:hover { background: var(--tint); color: var(--blue); }
.tools .sep { width: 0; border-left: 1px solid var(--line); }
.tools button.on { color: #fff; background: var(--ink); }
.looks { right: 18px; bottom: 18px; display: flex; }
.looks button { border: 0; border-right: 1px solid var(--line2); background: none; padding: 8px 13px; cursor: pointer; color: var(--text2); font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
.looks button:last-child { border-right: 0; }
.looks button:hover { color: var(--blue); background: var(--tint); }
.looks button.on { background: var(--ink); color: #fff; }
.prog { left: 50%; top: 18px; transform: translateX(-50%); display: none; align-items: center; gap: 16px; padding: 12px 18px 12px 12px; min-width: 400px; box-shadow: 0 18px 40px -18px rgba(17,24,39,.35); }
.prog.on { display: flex; animation: rise .4s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, -8px); } }
.ring { width: 50px; height: 50px; flex: none; }
.prog .t1 { font: 700 17px var(--disp); letter-spacing: .4px; text-transform: uppercase; }
.prog .t2 { color: var(--text2); font: 400 11px var(--mono); margin-top: 2px; }
.prog .eta { margin-left: auto; text-align: right; }
.prog .eta b { display: block; font: 700 30px/1 var(--disp); font-variant-numeric: tabular-nums; color: var(--gold); }
.prog .eta span { color: var(--text2); font: 500 9.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
.prog .line { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; background: var(--line2); }
.prog .line i { display: block; height: 100%; background: linear-gradient(90deg, #b9852c, #e2b45c); transition: width .8s; }
.canvas.running svg.pan, .canvas.running #three { filter: saturate(.5) opacity(.7); transition: filter .6s; }
.shimmer { position: absolute; inset: 0; pointer-events: none; display: none; background: linear-gradient(105deg, transparent 40%, rgba(185,133,44,.08) 50%, transparent 60%); background-size: 250% 100%; animation: sweep 2.4s linear infinite; }
.canvas.running .shimmer { display: block; }
@keyframes sweep { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.spot { position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(320px circle at var(--mx, -999px) var(--my, -999px), rgba(255,255,255,.35), transparent 70%); }
.loupe { position: absolute; z-index: 8; width: 200px; height: 200px; border-radius: 50%; pointer-events: none; display: none; overflow: hidden;
  background: #e6e8ea; box-shadow: 0 0 0 1px rgba(24,33,43,.25), 0 0 0 6px rgba(255,255,255,.7), 0 18px 40px rgba(17,24,39,.35); transform: translate(-50%, -50%); }
.loupe svg { width: 100%; height: 100%; }
.loupe .lz { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font: 500 10px var(--mono); color: var(--text2); background: rgba(255,255,255,.85); padding: 2px 7px; }
#parts { display: none; } #parts.on { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr 60px; }
.plist { grid-row: 1 / 3; overflow: auto; padding: 48px 0 14px; border-right: 1px solid var(--line); background: rgba(255,255,255,.75); z-index: 2; }
.plist .pi { padding: 9px 16px; cursor: pointer; color: var(--text); border-bottom: 1px solid var(--line2); }
.plist .pi:hover { background: var(--tint); } .plist .pi.on { background: var(--tint); box-shadow: inset 3px 0 0 var(--ink); }
.plist .pi b { font: 600 13px var(--mono); } .plist .pi span { display: block; font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .pi i { float: right; font-style: normal; font: 500 10px var(--mono); padding: 1px 6px; border: 1px solid var(--line); }
.plist .pi i.ok { background: #fbf4e4; color: #8a5f19; border-color: #ecd6a8; } .plist .pi i.no { background: var(--hover); color: var(--text3); }
.plist .pi i.bad { background: #ffecec; color: var(--red); border-color: #f3c6c3; }
#psvg { width: 100%; height: 100%; display: block; }
.pfoot { display: flex; align-items: center; gap: 14px; padding: 0 26px; font: 400 12px var(--mono); color: var(--text2); z-index: 2; }
.pfoot b { font: 700 26px var(--disp); color: var(--text); font-variant-numeric: tabular-nums; }
.pfoot #pnow { color: var(--text2); } .pfoot .btn { margin-left: auto; }
.thread { fill: none; stroke-width: 1.4; opacity: .6; transition: opacity .2s, stroke-width .2s; } .thread.hi { opacity: 1; stroke-width: 2.4; }
.status { grid-area: status; display: flex; align-items: center; gap: 18px; padding: 0 20px; font: 400 11px var(--mono); color: var(--text2); border-top: 1px solid var(--line); background: #fff; }
.status b { color: var(--text); font-weight: 400; } .status .r { margin-left: auto; display: flex; gap: 18px; }
#tip { position: fixed; pointer-events: none; z-index: 40; display: none; padding: 7px 10px; font-size: 12px; color: #fff; background: #18212b; max-width: 420px; }
#tip .m { font-family: var(--mono); color: #f0d29a; }
#msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--text2); pointer-events: none; text-align: center; font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
#render { position: absolute; inset: 0; display: none; background: #e6e8ea; } #render img { width: 100%; height: 100%; object-fit: contain; }
.flow { stroke-dasharray: 0.6 0.9; animation: flow .9s linear infinite; } @keyframes flow { to { stroke-dashoffset: -1.5; } }
.netdim { opacity: .2; transition: opacity .2s; }
.pin { cursor: pointer; } .pin circle.halo { animation: halo 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
.app.focus { grid-template-columns: 0 1fr 0; } .app.focus .left, .app.focus .right { display: none; }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border: 3px solid #fff; }
@media (max-width: 1000px) { .app { grid-template-columns: 0 1fr 320px; } .left { display: none; } }
</style>
</head>
<body>
<canvas id="contour"></canvas>
<div class="app">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbeec9"/><stop offset=".45" stop-color="#d9b56c"/><stop offset="1" stop-color="#9c6e2c"/></linearGradient></defs>
      <path d="M13.6 2 4.8 13.4h5.6L9.2 22l9.9-12.6h-6L13.6 2z" fill="url(#lg)" stroke="rgba(255,240,205,.5)" stroke-width=".5" stroke-linejoin="round"/></svg>
      <span class="wm">Zeus</span><span class="tag">AI PCB Harness</span></div>
    <div class="crumb">/ <span id="folder">board</span> / <b id="name">—</b></div>
    <div class="seg" id="seg"><button class="on" data-v="layout">Layout</button><button data-v="v3d">3D</button><button data-v="schem">Schematic</button><button data-v="parts">Parts</button></div>
    <span class="pill" id="pill"><span class="dot"></span><span id="pilltext">Loading</span></span>
    <a class="btn" id="report" href="/files/report.html" target="_blank">Report</a>
    <a class="btn primary" id="gerbers" href="/files/gerbers.zip">Download Gerbers</a>
  </div>

  <div class="left">
    <div class="sec"><h3>Layers</h3><div id="layers"></div></div>
    <div class="sec"><h3>Nets <span id="ncount"></span></h3><input class="search" id="nsearch" placeholder="Filter nets"><div id="nets"></div></div>
  </div>

  <div class="canvas" id="canvas">
    <div class="aura"></div><i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i>
    <div class="vtag" id="vtag">Layout · <b>01/04</b></div>
    <div class="view on" id="layout"><svg id="lsvg" class="pan"></svg></div>
    <div class="view" id="v3d"><div id="three" style="position:absolute;inset:0"></div><div class="float" id="mtagbox" style="right:34px;top:22px;padding:6px 11px;font:500 10px var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--ctext2)"><span id="mtag"></span></div><div id="render"><img id="rimg" alt="KiCad 3D render"></div></div>
    <div class="view" id="schem"><svg id="ssvg" class="pan"></svg></div>
    <div class="view" id="parts"><div class="plist" id="plist"></div><svg id="psvg"></svg>
      <div class="pfoot"><b id="pcount"></b><span id="pnow"></span><button class="btn" id="pverify">Verify pins</button></div></div>
    <div class="shimmer"></div><div class="spot"></div>
    <div class="loupe" id="loupe"><svg id="lpsvg"><use href="#lroot"/></svg><span class="lz">4×</span></div>
    <div class="float prog" id="prog">
      <svg class="ring" viewBox="0 0 54 54"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dfae"/><stop offset="1" stop-color="#b8893f"/></linearGradient></defs>
        <circle cx="27" cy="27" r="22" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="4"/>
        <circle id="ringarc" cx="27" cy="27" r="22" fill="none" stroke="url(#rg)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 27 27)" stroke-dasharray="0 140" style="transition:stroke-dasharray .8s; filter:drop-shadow(0 0 4px rgba(212,179,115,.55))"/>
        <text id="ringpct" x="27" y="31" text-anchor="middle" fill="#e8eaed" font-size="11" font-family="IBM Plex Mono">0%</text></svg>
      <div><div class="t1" id="pt1">Routing</div><div class="t2" id="pt2"></div></div>
      <div class="eta"><b id="peta">—</b><span>left, about</span></div>
      <div class="line"><i id="pline" style="width:0"></i></div>
    </div>
    <div class="float tools" id="tools">
      <button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="fit" title="Fit">⤢</button>

    vs.textContent = R.clean ? `Design, house rules${R.kicad_drc && R.kicad_drc.run ? ", KiCad DRC" : ""}${erc ? " and ERC" : ""} pass.` : "Click one to see it on the board."; }
  const card = $("#prog"); $("#canvas").classList.toggle("running", !!running); card.classList.toggle("on", !!running);
  if (running) {
    const frac = P.eta == null ? 0.03 : Math.max(0.03, Math.min(0.98, P.elapsed / (P.elapsed + P.eta)));
    $("#ringarc").setAttribute("stroke-dasharray", `${(2 * Math.PI * 22 * frac).toFixed(1)} 140`); $("#ringpct").textContent = Math.round(frac * 100) + "%";
    $("#pline").style.width = (frac * 100) + "%";
    const st = P.stage === "place+route" ? "Placing and routing" : P.stage[0].toUpperCase() + P.stage.slice(1);
    $("#pt1").textContent = st;
    $("#pt2").textContent = (P.tries ? `Try ${Math.min(P.tries_done + 1, P.tries)} of ${P.tries}` + (P.tries_done ? ` · ${P.tries_done} done` : "") + " · " : "") + secs(P.elapsed) + " so far";
    $("#peta").textContent = P.eta == null ? "…" : clock(P.eta);
  }
}

// ---------- data ----------
async function getJ(u) { try { return await (await fetch(u, { cache: "no-store" })).json(); } catch (e) { return null; } }
async function loadAll() {
  R = await getJ("/api/result"); B = await getJ("/api/board"); SHEETS = null;
  $("#msg").textContent = !B || B.error ? ((B && B.error) || "No board yet") : "";
  drawHeader(); drawLayers(); drawNets(); drawChecks(); drawRun(); drawFiles(); drawLayout(); fitLayout();
  if (activeView() === "schem") drawSchem(); if (activeView() === "parts") drawParts(); if (threeReady) build3d();
}
let wasRunning = false;
async function poll() {
  P = await getJ("/api/progress"); drawHeader();
  if (P && !P.done) wasRunning = true; else if (wasRunning) { wasRunning = false; await loadAll(); }
  setTimeout(poll, P && !P.done ? 1000 : 4000);
}
(async () => { P = await getJ("/api/progress"); await loadAll(); poll(); })();
window.addEventListener("resize", () => { fitLayout(); if (activeView() === "parts") drawParts(); });
window.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return;
  if (e.key === "f") fitLayout(true); for (const i of [1, 2, 3, 4]) if (e.key === String(i)) $$("#seg button")[i - 1].click();
  if (e.key === "Escape") { selectNet(null); setLoupe(false); }
  if (e.key === "l" && activeView() === "layout") setLoupe(!loupeOn);
  if (e.key === "e" && activeView() === "v3d") $("#explode").click(); });
</script>
